name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo start > /tmp/build.log
      - id: j
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - id: a
        continue-on-error: true
        uses: android-actions/setup-android@v3
      - id: g
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set +e
          echo "java=${{ steps.j.outcome }} android=${{ steps.a.outcome }} gradle=${{ steps.g.outcome }}" >> /tmp/build.log
          which gradle java >> /tmp/build.log 2>&1
          gradle assembleDebug --no-daemon --stacktrace >> /tmp/build.log 2>&1
          echo "exit=$?" >> /tmp/build.log
          exit 0
      - name: Save log
        if: always()
        run: |
          git fetch origin
          git checkout -B buildlog
          cp /tmp/build.log build.log
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f build.log
          git commit -m "build log" || true
          git push -f origin buildlog
      - name: Check result
        run: grep -q "^exit=0" /tmp/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: CocAutoAttack-apk
          path: app/build/outputs/apk/debug/app-debug.apk
